name: Daily Quantitative Market Screener & Watchlist Updater

on:
  schedule:
    # 12:00 UTC = 08:00 AM New York (EDT) / 14h00 Paris (CEST) du lundi au vendredi (avant l'ouverture)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Permet de lancer le screener à tout moment depuis GitHub

permissions:
  contents: write

jobs:
  screen_market:
    name: Screen Broad Market & Update Watchlist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Screener
        run: |
          python screener.py

      - name: Commit and Push Updated Watchlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json screener_results.json
          git commit -m "Automated daily watchlist update via quantitative screener [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"

      - name: Upload Screener Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-results
          path: |
            watchlist.json
            screener_results.json
          retention-days: 7
